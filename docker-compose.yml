services:
  dash-app:
    build: .
    container_name: bc_performance_dashboard
    restart: unless-stopped
    environment:
      - PORT=10000
    env_file:
      - .env
    expose:
      - "10000"

  nginx:
    image: nginx:alpine
    container_name: bc_dashboard_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dash-app